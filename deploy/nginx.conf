# monit.rocky-rabbit.ru -> routers-dashboard on 127.0.0.1:8787
# TLS is added by: certbot --nginx -d monit.rocky-rabbit.ru
limit_req_zone $binary_remote_addr zone=monit_login:10m rate=10r/m;

server {
    server_name monit.rocky-rabbit.ru;

    listen 80;
    listen [::]:80;

    location = /api/login {
        limit_req zone=monit_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
