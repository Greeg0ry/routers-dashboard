# luci-monit.rocky-rabbit.ru -> the LuCI proxy of routers-dashboard (LUCI_URL in .env).
# A separate address, so a router's web page never runs on the dashboard's own origin.
# TLS is added by: certbot --nginx -d luci-monit.rocky-rabbit.ru
server {
    server_name luci-monit.rocky-rabbit.ru;

    listen 80;
    listen [::]:80;

    # firmware images and backups uploaded to a router
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
